# This is the config file for the mm-vae 
model: 
  type: mmVAE
data: 
  random_seed: 1
model_params: 
  latent_dim: 20
training_params: 
  epochs: 30
  batch_size: 128
  log_interval: 10 # number of batches to wait until logging the training status 
loss_params: 
  mnist_scale: 3.92 # this is relative pixels 3092/784
  svhn_scale: 1.0
  num_samples: 30
output:
  output_folder: results_mmVAE_IWAE
runtime_config: 
  accelerator: True # True means try to use GPU
